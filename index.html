<style>
/* Layout: the island fills the sea on the left; a sea-glass ledger column on the right holds dice, hand, builds, trades and the log. */
:root{
  --sea:#2c6b7d; --sea-2:#1f5262; --wave:#3b7e90; --sand:#e6d4a1;
  --panel:#edf1ea; --panel-2:#dfe6dc; --ink:#1d2a2f; --muted:#5a6a6c; --line:#c5d0c4;
  --accent:#b9502c; --accent-ink:#fff8ef; --hot:#fff3b0;
  --display:'Alegreya SC',Georgia,'Times New Roman',serif;
  --body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sea-2);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
.app{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;height:100%;box-sizing:border-box;padding-block:16px;padding-inline:16px}
.board-wrap{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.board-wrap .svgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hud h1{color:var(--panel);font-size:22px;white-space:nowrap}
.hud .status{flex:1;min-width:220px;background:rgba(10,30,38,.55);border:1px solid rgba(255,255,255,.12)}
.hud .ghost{color:var(--panel);border-color:rgba(255,255,255,.35);padding:6px 10px}
.hud .ghost:hover:not(:disabled){border-color:var(--panel)}
#board{width:100%;height:100%;max-height:100%;display:block;user-select:none;-webkit-user-select:none}
.panel{min-width:0;min-height:0;overflow:auto;background:var(--panel);border-radius:12px;padding-block:14px;padding-inline:16px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:.01em;line-height:1}
h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;margin:0 0 8px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.status{background:var(--ink);color:var(--panel);border-radius:8px;padding:10px 12px;font-weight:500}
.status b{color:var(--hot)}
button{font:inherit;font-weight:700;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button.ghost{background:transparent}
.dice-row{display:flex;align-items:center;gap:8px}
.dice{display:flex;gap:6px;margin-right:auto;align-items:center}
.die{width:38px;height:38px}
.die rect{fill:#fff;stroke:var(--ink);stroke-width:2}
.die circle{fill:var(--ink)}
.die.blank rect{fill:var(--panel-2);stroke:var(--line)}
.sum{font-family:var(--display);font-weight:800;font-size:24px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid transparent}
.score{grid-row:1/3;width:34px;height:34px;border-radius:8px;border:2px solid rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.score.light{color:var(--ink);text-shadow:none}
.score.close{box-shadow:0 0 0 3px var(--accent)}
.togo{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.togo.close{color:var(--accent)}
.pl.cur{background:#fff;border-color:var(--line)}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(0,0,0,.45);display:inline-block;flex:none}
.pl b{font-weight:800}
.vp{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.meta{grid-column:2/4;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--panel);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.card{border-radius:8px;padding:8px 4px 6px;text-align:center;color:#fff;border:1.5px solid rgba(0,0,0,.25);position:relative;overflow:hidden}
.card .n{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.card .l{font-size:12px;font-weight:700;letter-spacing:.03em;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.card.zero{opacity:.45}
.builds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.builds button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.cost{display:flex;gap:3px}
.cost i{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.35);display:block}
.devs{display:flex;flex-direction:column;gap:6px}
.dev{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.dev div{flex:1;min-width:0}
.dev small{display:block;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13.5px}
.trade{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.trow .lbl{font-size:13px;font-weight:700;color:var(--muted);width:52px}
select,input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:#fff;color:var(--ink)}
.offer{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:5px 4px;align-items:center}
.offer .lbl{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.1}
.oh{font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.oh .sw{width:12px;height:12px}
.step{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:7px;min-width:0}
.step.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.step button{border:0;background:transparent;padding:4px 0;width:17px;font-size:15px;line-height:1;border-radius:6px}
.step b{font-variant-numeric:tabular-nums;font-size:14px}
.log{display:flex;flex-direction:column;gap:3px;font-size:13.5px;max-height:220px;overflow:auto}
.log div{display:flex;gap:6px;align-items:baseline}
.log .sw{width:9px;height:9px;border-radius:50%;position:relative;top:1px}
.log .sys{color:var(--muted);font-style:italic}
#modal{position:fixed;inset:0;background:rgba(15,30,36,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--panel);border-radius:12px;padding:18px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px}
#modal h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
#modal p{margin:0;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;margin:6px 4px 0 0;padding:3px 9px;border-radius:999px;border:1.5px solid rgba(0,0,0,.4);color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.35);font-size:14px}
.chip.light{color:var(--ink);text-shadow:none}
.drow{display:grid;grid-template-columns:14px 1fr auto 32px 22px 32px;gap:8px;align-items:center}
.drow b{text-align:center;font-variant-numeric:tabular-nums}
.drow .have{color:var(--muted);font-size:13px}
/* board */
.token{fill:#f6efdc;stroke:#6d5f43;stroke-width:1.2}
.num{font-family:var(--display);font-weight:800;font-size:18px;text-anchor:middle;fill:#2a2622}
.num.red{fill:#b3261e}
.pip{fill:#2a2622}.pip.red{fill:#b3261e}
.pier{stroke:#7a5b3a;stroke-width:4;stroke-linecap:round}
.port{fill:#f6efdc;stroke:#7a5b3a;stroke-width:2}
.port-t{font-family:var(--body);font-weight:800;font-size:10.5px;text-anchor:middle;fill:#2a2622}
.robber path,.robber circle{fill:#1c1f22;stroke:#f6efdc;stroke-width:1.2}
.hot-v{fill:var(--hot);stroke:#1d2a2f;stroke-width:2;pointer-events:none}
.hot-e{stroke:var(--hot);stroke-width:6;stroke-linecap:round;stroke-dasharray:6 6;pointer-events:none}
.hit{fill:transparent;stroke:transparent;cursor:pointer}
.hot-tile{cursor:pointer}
.hot-tile .shade{fill:var(--hot);opacity:.28}
.hot-tile:hover .shade{opacity:.5}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media (max-width:860px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  #board{height:auto;max-height:none}
  .panel{overflow:visible}
  .hud h1{flex:1}
  .hud .status{order:3;flex-basis:100%}
}
</style>
<style>
/* online additions */
#lobby{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-inline:16px;box-sizing:border-box}
.lcard{background:var(--panel);border-radius:14px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.lcard h1{font-size:34px}
.lcard p{margin:0;color:var(--muted)}
.lcard label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.lcard input{width:100%;box-sizing:border-box;font-size:16px;padding:9px 10px}
.lrow{display:flex;gap:8px;align-items:flex-end}
.lrow > div{flex:1;min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.12em;line-height:1}
.seats{display:flex;flex-direction:column;gap:6px}
.seat{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seat.bot{background:transparent;border-style:dashed;color:var(--muted)}
.err{color:#a3261c;font-weight:700}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:auto}
#offerbar:empty{display:none}
#offerbar{background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#offerbar .txt{flex:1;min-width:200px}
.hud .code-btn{font-family:var(--display);letter-spacing:.08em}
.botlbl{font-size:11px;font-weight:700;color:var(--muted);margin-left:4px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
/* map corner buttons + dice belt */
.svgbox{position:relative}
.mapctl{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;padding-inline:6px;pointer-events:none}
.mapctl:empty{display:none}
.mapbtn{pointer-events:auto;font-size:16px;padding:10px 18px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.mapbtn:disabled{opacity:.55}
.mapbtn.end{background:var(--panel)}
.mapbtn.ready{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--hot),0 4px 14px rgba(0,0,0,.35)}}
.belt{display:flex;align-items:center;gap:6px;overflow-x:auto;background:rgba(10,30,38,.55);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 8px;min-height:52px;scrollbar-width:none}
.belt::-webkit-scrollbar{display:none}
.belt-empty{color:rgba(237,241,234,.7);font-size:13.5px;padding-inline:4px}
.roll-chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:8px;border:2px solid var(--pc);border-left-width:7px;padding:3px 9px;height:36px;opacity:.82}
.roll-chip b{font-family:var(--display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
.roll-chip.latest{opacity:1;height:40px;box-shadow:0 0 0 2px var(--hot)}
.roll-chip.latest b{font-size:22px}
.roll-chip small{font-size:12px;font-weight:700;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll-chip .mini{display:flex;gap:3px}
.roll-chip .mini .die{width:26px;height:26px}
.roll-chip.seven b{color:#b3261e}
@media (prefers-reduced-motion:reduce){.mapbtn.ready{animation:none}}
/* your-turn banner */
#turnflash{position:fixed;left:0;right:0;top:38%;z-index:30;pointer-events:none;text-align:center;
  background:var(--pc);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,52px);
  padding-block:18px;border-top:3px solid rgba(0,0,0,.35);border-bottom:3px solid rgba(0,0,0,.35);box-shadow:0 10px 40px rgba(0,0,0,.45);opacity:0}
#turnflash.light{color:var(--ink);text-shadow:none}
#turnflash.go{animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scaleY(.4)}12%{opacity:1;transform:scaleY(1)}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#turnflash.go{animation:flashfade 1.1s linear forwards}@keyframes flashfade{0%,80%{opacity:1}100%{opacity:0}}}
/* confirmations that need the map visible sit at the bottom */
#modal.low{align-items:flex-end;background:rgba(15,30,36,.25);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#modal.low .box{max-width:460px}
/* slightly tighter hand + player list */
.panel h2{margin-bottom:6px}
.hand{gap:5px}
.card{padding:6px 3px 4px;border-radius:7px}
.card .n{font-size:21px}
.card .l{font-size:11.5px}
.players{gap:4px}
.pl{grid-template-columns:30px 1fr auto;gap:1px 9px;padding:5px 8px}
.score{width:30px;height:30px;font-size:18px;border-radius:7px}
.pl b{font-size:14.5px}
.meta{font-size:12.5px}
.togo{font-size:12px}
.mapbtn.endturn{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* mini scoreboard in the water, top-left of the map */
.mapscore{position:absolute;top:5px;left:5px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.ms{width:21px;height:21px;box-sizing:border-box;border-radius:5px;border:1.5px solid rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ms.light{color:var(--ink);text-shadow:none}
.ms.close{box-shadow:0 0 0 3px var(--accent),0 2px 6px rgba(0,0,0,.35)}
.ms.cur{outline:2px solid var(--hot);outline-offset:1px}
.endwrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.endwrap .sure{color:#fff;font-weight:700;font-size:13.5px;text-shadow:0 1px 3px rgba(0,0,0,.8);padding-right:4px}
/* road spots: bright yellow on a black outline so they stand out on any tile */
.hot-e-bg{stroke:#111;stroke-width:13;stroke-linecap:round;pointer-events:none}
.hot-e{stroke:#ffe14d!important;stroke-width:7!important;stroke-dasharray:none!important;stroke-linecap:round;pointer-events:none}
.epulse{animation:epulse 1s ease-in-out infinite}
@keyframes epulse{50%{stroke:#fffbe0}}
@media (prefers-reduced-motion:reduce){.epulse{animation:none}}
/* "You have" counts above the trade steppers */
.oh .ohtop{display:flex;align-items:center;gap:4px}
.oh .have{font-family:var(--display);font-weight:800;font-size:18px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.oh .have.none{color:var(--line)}
.ms.champ{outline:3px solid #ffd23f;outline-offset:1px;box-shadow:0 0 12px rgba(255,210,63,.9)}
/* color picker */
.cpick{display:flex;gap:8px;flex-wrap:wrap}
.csw{width:40px;height:40px;min-height:0;padding:0;border-radius:10px;border:2px solid rgba(0,0,0,.35);color:#fff;font-size:18px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.csw.on{outline:3px solid var(--ink);outline-offset:2px}
.csw:disabled{opacity:.25;cursor:not-allowed}
.csw[data-c="#f2efe6"]{color:var(--ink);text-shadow:none}
/* "something happened to you" pop-up */
#alertbox{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:25;width:min(420px,calc(100% - 32px));box-sizing:border-box;
  background:#b3261e;color:#fff;font-weight:700;font-size:15px;line-height:1.35;padding:12px 16px;border-radius:10px;border:2px solid rgba(0,0,0,.35);box-shadow:0 10px 30px rgba(0,0,0,.4);
  display:flex;flex-direction:column;gap:4px;pointer-events:none}
#alertbox[hidden]{display:none}
.modepick{display:flex;gap:6px}
.modepick button{flex:1;min-height:44px}
.modepick button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* hand size next to each score square */
.msrow{display:flex;align-items:center;gap:3px}
.mc{display:flex;align-items:center;gap:2px;height:16px;padding:0 5px 0 3px;border-radius:999px;background:rgba(10,30,38,.72);color:#fff;font-weight:800;font-size:10.5px;font-variant-numeric:tabular-nums}
.mc i{width:6px;height:9px;border-radius:2px;background:#f2efe6;border:1px solid rgba(0,0,0,.4);display:block}
.mc.over{background:#b3261e}
/* most-rolled numbers, top-right of the map */
.maphot:empty{display:none}
.maphot{position:absolute;top:5px;right:5px;background:rgba(10,30,38,.7);border-radius:7px;padding:4px 6px;display:flex;flex-direction:column;gap:1px;pointer-events:none;color:#fff;width:76px;box-sizing:border-box}
.mh-t{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);white-space:nowrap}
.mh-r{display:grid;grid-template-columns:15px 1fr 11px;align-items:center;gap:3px;font-variant-numeric:tabular-nums;height:13px}
.mh-r b{font-family:var(--display);font-size:12px;text-align:right;line-height:1}
.mh-r b.red{color:#ff8f86}.mh-r b.seven{color:#ffd23f}
.mh-r small{font-size:9.5px;font-weight:700;text-align:right}
.mh-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.mh-bar span{display:block;height:100%;background:#fff3b0;border-radius:3px}
</style>
</head><body>
<div id="lobby" hidden></div>
<div class="app" id="app" hidden>
  <div class="board-wrap"><header class="hud" id="hud"></header><div id="offerbar"></div><div class="svgbox"><svg id="board" viewBox="-345 -305 690 610" aria-label="Island board"></svg><div class="mapscore" id="mapscore"></div><div class="maphot" id="maphot"></div><div class="mapctl" id="mapctl"></div></div><div class="belt" id="belt" aria-label="Recent dice rolls"></div></div>

</div>

/* ---------- board setup ---------- */
function buildGame(seats,host,rules){
  const coords=[];for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++)if(Math.abs(q+r)<=2)coords.push([q,r]);
  let tiles;
  for(let t=0;t<800;t++){
    const types=shuffle(['wood','wood','wood','wood','brick','brick','brick','wool','wool','wool','wool','grain','grain','grain','grain','ore','ore','ore','desert']);
    const nums=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);
    tiles=coords.map(([q,r],i)=>({q,r,type:types[i],num:types[i]==='desert'?0:nums.pop(),x:S*SQ3*(q+r/2),y:S*1.5*r}));
    const hot=tiles.filter(x=>x.num===6||x.num===8);
    if(!hot.some(a=>hot.some(b=>a!==b&&hexDist(a,b)===1)))break;
  }
  const verts=[],edges=[],ek={};
  tiles.forEach((t,ti)=>{
    t.v=[];
    for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30),x=t.x+S*Math.cos(a),y=t.y+S*Math.sin(a);
      let v=verts.find(v=>Math.hypot(v.x-x,v.y-y)<1);
      if(!v){v={id:verts.length,x:+x.toFixed(2),y:+y.toFixed(2),hexes:[],adj:[],edges:[],b:null,port:null};verts.push(v)}
      v.hexes.push(ti);t.v.push(v.id)}
    for(let i=0;i<6;i++){const a=t.v[i],b=t.v[(i+1)%6],k=a<b?a+'-'+b:b+'-'+a;let e=ek[k];
      if(e===undefined){e=edges.length;ek[k]=e;edges.push({id:e,a,b,road:null,hexes:[]});verts[a].adj.push(b);verts[b].adj.push(a);verts[a].edges.push(e);verts[b].edges.push(e)}
      edges[e].hexes.push(ti)}
  });
  const coast=edges.filter(e=>e.hexes.length===1).map(e=>{const A=verts[e.a],B=verts[e.b];return{e,ang:Math.atan2(A.y+B.y,A.x+B.x)}}).sort((a,b)=>a.ang-b.ang);
  const ptypes=shuffle(['any','any','any','any','wood','brick','wool','grain','ore']);
  const ports=[0,3,7,10,13,17,20,23,27].map((ci,i)=>{const e=coast[ci].e;verts[e.a].port=ptypes[i];verts[e.b].port=ptypes[i];return{e:e.id,type:ptypes[i]}});
  const taken=new Set(seats.map(s=>s.name.toLowerCase()));const botPool=shuffle(BOTNAMES.filter(n=>!taken.has(n.toLowerCase())));
  const entries=shuffle([...seats.map(s=>({kind:'human',uid:s.uid,name:s.name})),...Array(4-seats.length).fill(0).map((_,k)=>({kind:'bot',uid:null,name:botPool[k]}))]);
  const used=seats.map(s=>s.color).filter(Boolean);const botCols=[...PCOL,...COLORS.map(x=>x.c)].filter((c,k,a)=>a.indexOf(c)===k&&!used.includes(c));
  entries.forEach(e=>{if(e.kind==='human'){const s=seats.find(s=>s.uid===e.uid);e.color=s&&s.color}if(!e.color)e.color=botCols.shift()});
  const players=entries.map((e,i)=>({i,name:e.name,kind:e.kind,uid:e.uid,color:e.color,res:z(),dev:[],knights:0,roads:15,setts:5,cities:4}));
  const base=[...Array(14).fill('knight'),...Array(5).fill('vp'),'road','road','plenty','plenty','monopoly','monopoly'];
  if(rules==='house'){base.splice(0,2);Object.entries(HOUSE).forEach(([t,n])=>{for(let k=0;k<n;k++)base.push(t)})}
  const deck=shuffle(base);
  const first=Math.random()*4|0,order=[0,1,2,3].map(i=>(first+i)%4);
  const hostSeat=players.findIndex(p=>p.uid===host);
  const st={phase:'setup',host,tiles,verts,edges,ports,players,deck,robber:tiles.findIndex(t=>t.type==='desert'),
    setupOrder:[...order,...order.slice().reverse()],setupIdx:0,cur:first,first,sub:'settlement',lastSett:null,
    turn:0,dice:null,devPlayed:false,longest:null,lens:[0,0,0,0],army:null,log:[],winner:null,freeRoads:0,
    discards:null,offer:null,rules:rules==='house'?'house':'classic',botRunner:hostSeat<0?0:hostSeat};
  st.log.push({p:null,text:`Seats were drawn at random. ${esc(players[first].name)} goes first. Everyone places two settlements, each with a road.`});
  return st;
}

function vp(p,hidden){let v=0;G.verts.forEach(x=>{if(x.b&&x.b.p===p.i)v+=x.b.city?2:1});if(G.longest===p.i)v+=2;if(G.army===p.i)v+=2;if(hidden)v+=p.dev.filter(d=>d.type==='vp').length;return v}
function canSettle(vid,pi,setup){const v=G.verts[vid];if(v.b||v.adj.some(a=>G.verts[a].b))return false;return setup||v.edges.some(e=>G.edges[e].road===pi)}
function canRoad(eid,pi){const e=G.edges[eid];if(e.road!==null)return false;

const canCity=(vid,pi)=>{const b=G.verts[vid].b;return b&&b.p===pi&&!b.city};
function rate(pi,r){let k=4;G.verts.forEach(v=>{if(v.b&&v.b.p===pi&&v.port){if(v.port==='any')k=Math.min(k,3);else if(v.port===r)k=2}});return k}
const desertTile=()=>G.tiles.findIndex(t=>t.type==='desert');
const desertCount=pi=>{const ti=desertTile();return ti<0?0:G.tiles[ti].v.filter(v=>G.verts[v].b&&G.verts[v].b.p===pi).length};
const canPlayDev=(p,t)=>{if(t==='vp')return false;if(t==='desert')return desertCount(p.i)>=3&&p.dev.some(d=>d.type==='desert');
  return !G.devPlayed&&p.dev.some(d=>d.type===t&&d.turn<G.turn)};
const fmt=g=>Object.entries(g).filter(([,n])=>n>0).map(([r,n])=>n+' '+RN[r]).join(', ');
function prodOf(p){const o=z();G.verts.forEach(v=>{if(v.b&&v.b.p===p.i)v.hexes.forEach(ti=>{const t=G.tiles[ti];if(t.type!=='desert')o[t.type]+=pips(t.num)*(v.b.city?2:1)})});return o}
function longestFor(pi){let best=0;
  const dfs=(v,used,len)=>{if(len>best)best=len;const b=G.verts[v].b;if(len>0&&b&&b.p!==pi)return;
    for(const eid of G.verts[v].edges){const e=G.edges[eid];if(e.road!==pi||used.has(eid))continue;used.add(eid);dfs(e.a===v?e.b:e.a,used,len+1);used.delete(eid)}};
  G.edges.forEach(e=>{if(e.road===pi){dfs(e.a,new Set(),0);dfs(e.b,new Set(),0)}});return best}
function updateLongest(){const Ls=G.players.map(p=>longestFor(p.i));G.lens=Ls;const mx=Math.max(...Ls);let h=G.longest;
  if(mx<5)h=null;else if(h!==null&&Ls[h]===mx){}else{const tops=Ls.map((l,i)=>l===mx?i:-1).filter(i=>i>=0);h=tops.length===1?tops[0]:null}
  if(h!==G.longest){if(h!==null)log(G.players[h],`took the Longest Road (${Ls[h]})`);else log(null,'No one holds the Longest Road now.')}
  G.longest=h}
function updateArmy(p){if(p.knights>=3&&G.army!==p.i&&(G.army===null||p.knights>G.players[G.army].knights)){G.army=p.i;log(p,`took the Largest Army (${p.knights} knights)`)}}
function checkWin(){const p=P();if(!won()&&vp(p,true)>=WIN){G.winner=p.i;L.mode=null;log(p,`reached ${vp(p,true)} points and won!`)}}
function produce(sum){const gains=G.players.map(()=>({}));
  G.tiles.forEach((t,ti)=>{if(t.num!==sum)return;if(ti===G.robber){log(null,`The robber blocks the ${TILE[t.type].name} (${sum}).`);return}
    t.v.forEach(vid=>{const b=G.verts[vid].b;if(b){const n=b.city?2:1;G.players[b.p].res[t.type]+=n;gains[b.p][t.type]=(gains[b.p][t.type]||0)+n}})});
  let any=false;gains.forEach((g,i)=>{const s=fmt(g);if(s){any=true;log(G.players[i],'collected '+s)}});if(!any)log(null,'Nothing produced.')}
function log(p,text,secret,alert){G.logN=(G.logN||0)+1;G.log.push({n:G.logN,p:p?p.i:null,text,secret:secret||null,alert:alert||null});if(G.log.length>70)G.log.splice(0,G.log.length-70)}

/* ---------- actions (run only on the acting player's device) ---------- */
function placeSetupSettlement(pi,vid){const p=G.players[pi];G.verts[vid].b={p:pi,city:false};p.setts--;G.lastSett=vid;G.sub='road';
  if(G.setupIdx>=4){const g={};G.verts[vid].hexes.forEach(ti=>{const t=G.tiles[ti];if(t.type!=='desert'){p.res[t.type]++;g[t.type]=(g[t.type]||0)+1}});log(p,'founded a settlement and collected '+(fmt(g)||'nothing'))}
  else log(p,'founded a settlement')}
function placeSetupRoad(pi,eid){G.edges[eid].road=pi;G.players[pi].roads--;G.sub='settlement';G.setupIdx++;
  if(G.setupIdx>=8){G.phase='roll';G.cur=G.first;G.turn=1;log(null,'The island is settled. Round one begins.')}else G.cur=G.setupOrder[G.setupIdx]}
function buildRoad(p,eid,free){if(!free)pay(p,COST.road);G.edges[eid].road=p.i;p.roads--;log(p,free?'built a free road':'built a road');updateLongest()}
function buildSettlement(p,vid){pay(p,COST.settlement);G.verts[vid].b={p:p.i,city:false};p.setts--;log(p,'built a settlement');updateLongest()}
function buildCity(p,vid){pay(p,COST.city);G.verts[vid].b.city=true;p.cities--;p.setts++;log(p,'upgraded to a city')}
function buyDev(p){pay(p,COST.dev);const c=G.deck.pop();p.dev.push({type:c,turn:G.turn});log(p,'bought a development card',{[p.i]:`bought a development card: ${DEV[c][0]}`})}

async function rollDice(){const a=1+(Math.random()*6|0),b=1+(Math.random()*6|0);G.dice=[a,b];(G.rollCounts=G.rollCounts||{})[a+b]=(G.rollCounts[a+b]||0)+1;(G.rolls=G.rolls||[]).push({p:G.cur,a,b});if(G.rolls.length>12)G.rolls.splice(0,G.rolls.length-12);log(P(),`rolled ${a+b}`);
  if(a+b===7){const need={};
    for(const p of G.players){const n=cards(p);if(n>7){const k=Math.floor(n/2);if(isBot(p)){aiDiscard(p,k);log(p,`discarded ${k} cards`)}else need[p.i]=k}}
    if(Object.keys(need).length){G.discards=need;G.phase='discard';await push();render();
      await waitUntil(()=>!G.discards||!Object.keys(G.discards).length);G.discards=null}
    await moveRobber();
  }else produce(a+b);
  G.phase='main';await push();render()}
async function moveRobber(){const p=P();let ti;G.phase='robber';await push();
  if(!isBot(p)){L.mode='robber';render();
    for(;;){ti=await new Promise(r=>L.robberResolve=r);const t=G.tiles[ti];
      const who=[...new Set(t.v.map(v=>G.verts[v].b).filter(Boolean).map(b=>b.p))].map(i=>`<span class="chip${isLight(G.players[i].color)?' light':''}" style="background:${G.players[i].color}">${nm(i)} · ${cards(G.players[i])} cards</span>`);
      L.robberPreview=ti;render();
      const ok=await chooseModal('Move the robber here?',`${TILE[t.type].name}${t.num?' ('+t.num+')':''}. ${who.length?'<br>On this tile: '+who.join(' '):'<br>No one has a building on this tile.'}`,
        [{label:'Move robber',value:true},{label:'Pick another tile',value:false}],true);
      L.robberPreview=null;if(ok)break;render()}
    L.mode=null}
  else{ti=aiRobberHex(p.i);await sleep(450)}
  G.robber=ti;const t=G.tiles[ti];log(p,`moved the robber to the ${TILE[t.type].name}${t.num?' ('+t.num+')':''}`);
  const vics=[...new Set(t.v.map(v=>G.verts[v].b).filter(b=>b&&b.p!==p.i).map(b=>b.p))].filter(i=>cards(G.players[i])>0);
  if(vics.length){let vi;
    if(!isBot(p))vi=vics.length>1?await chooseModal('Steal a card','Choose whose hand to draw from.',vics.map(i=>({label:`${esc(G.players[i].name)} · ${cards(G.players[i])} cards`,value:i,color:G.players[i].color}))):vics[0];
    else vi=maxBy(vics,i=>vp(G.players[i])+Math.random()*.5);
    const v=G.players[vi],pool=[];RES.forEach(r=>{for(let k=0;k<v.res[r];k++)pool.push(r)});
    if(pool.length){const r=pool[Math.random()*pool.length|0];v.res[r]--;p.res[r]++;
      log(p,`stole a card from ${pn(v)}`,{[p.i]:`stole 1 ${RN[r]} from ${pn(v)}`,[v.i]:`stole 1 ${RN[r]} from you`},{[v.i]:`${pn(p)} moved the robber and stole 1 ${RN[r]} from you.`})}}
  await push();render()}
async function playDev(p,type,arg){if(isHouse(type)){await playHouse(p,type,arg);return}const idx=p.dev.findIndex(d=>d.type===type&&d.turn<G.turn);p.dev.splice(idx,1);G.devPlayed=true;log(p,`played ${DEV[type][0]}`);
  if(type==='knight'){p.knights++;updateArmy(p);const prev=G.phase;await moveRobber();G.phase=prev}
  if(type==='road'){
    if(!isBot(p)){G.freeRoads=Math.min(2,p.roads);L.mode='freeRoad';if(!hotEdges().size){L.mode=null;G.freeRoads=0}}
    else for(let k=0;k<2&&p.roads>0;k++){let e=roadTarget(p);if(e==null)e=G.edges.find(x=>canRoad(x.id,p.i))?.id;if(e==null)break;buildRoad(p,e,true)}}
  if(type==='plenty'){let picks=arg;
    if(!isBot(p)){const opts=RES.map(r=>({label:RN[r],value:r,color:TILE[r].fill}));picks=[await chooseModal('Year of Plenty','Pick your first resource.',opts),await chooseModal('Year of Plenty','Pick your second resource.',opts)]}
    picks.forEach(r=>p.res[r]++);log(p,'took '+picks.map(r=>RN[r]).join(' and '))}
  if(type==='monopoly'){const r=!isBot(p)?await chooseModal('Monopoly','Every opponent hands over all cards of this resource.',RES.map(r=>({label:RN[r],value:r,color:TILE[r].fill}))):arg;
    let n=0;const lost={};G.players.forEach(o=>{if(o!==p){const k=o.res[r];n+=k;o.res[r]=0;lost[o.i]=k}});p.res[r]+=n;
    const al={};Object.entries(lost).forEach(([i,k])=>al[i]=`${pn(p)} played Monopoly and took ${k?'all '+k+' of your '+RN[r]:'everyone’s '+RN[r]+' (you had none)'}.`);
    log(p,`used Monopoly to take every ${RN[r]} card (${n} in total)`,null,al)}
  checkWin();await push();render()}
/* ---------- House Rules cards ---------- */
const owned=(pi,cityOk)=>G.verts.filter(v=>v.b&&v.b.p===pi&&(cityOk||!v.b.city));
const oppBuildings=pi=>G.verts.filter(v=>v.b&&v.b.p!==pi);

async function playHouse(p,type,arg){
  const idx=p.dev.findIndex(d=>d.type===type&&(type==='desert'||d.turn<G.turn));if(idx<0)return;
  p.dev.splice(idx,1);if(type!=='desert')G.devPlayed=true;

function aiWorstRoad(p,rs){return maxBy(rs,id=>{const e=G.edges[id];let s=Math.random()*.2;[e.a,e.b].forEach(v=>{const V=G.verts[v];if(V.b&&V.b.p===p.i)s-=1;s-=V.edges.filter(x=>x!==id&&G.edges[x].road===p.i).length*.6});return s})}
/* what a computer player does with a House Rules card (returns true if it played one) */
async function aiHouse(p){

  if(G.devPlayed)return false;
  const others=G.players.filter(o=>o!==p),lead=maxBy(others,o=>leaderScore(o.i));
  if(has('bomb')){const ts=oppBuildings(p.i);if(ts.length){const v=maxBy(ts,v=>(v.b.p===lead.i?3:0)+(v.b.city?1:0)+v.hexes.reduce((s,ti)=>s+pips(G.tiles[ti].num),0)*0.1);await playHouse(p,'bomb',v.id);return true}}
  if(has('highway')){const pool=others.reduce((s,o)=>s+Math.min(2,cards(o)),0);
    if(pool>=4){await playHouse(p,'highway',{mode:'steal'});return true}
    const m=missing(p,COST[goal(p)]),picks=[];RES.forEach(r=>{for(let k=0;k<(m[r]||0);k++)picks.push(r)});while(picks.length<4)picks.push(['grain','ore','wool','wood','brick'][picks.length%5]);
    await playHouse(p,'highway',{mode:'bank',picks:picks.slice(0,4)});return true}
  if(has('burn')){const rs=G.edges.filter(e=>e.road===lead.i).map(e=>e.id);const any=G.edges.filter(e=>e.road!=null&&e.road!==p.i).map(e=>e.id);
    const picks=shuffle(rs.length>=2?rs:any).slice(0,2);if(picks.length){await playHouse(p,'burn',picks);return true}}
  if(has('swap')){const mine=owned(p.i,false),theirs=G.verts.filter(v=>v.b&&!v.b.city&&v.b.p!==p.i);
    if(mine.length&&theirs.length){const a=maxBy(mine,v=>-vScore(v,p)),b=maxBy(theirs,v=>vScore(v,p));if(vScore(b,p)-vScore(a,p)>2){await playHouse(p,'swap',[a.id,b.id]);return true}}}
  if(has('numswap')){const mineT=new Set();owned(p.i,true).forEach(v=>v.hexes.forEach(ti=>mineT.add(ti)));
    const nums=G.tiles.map((t,i)=>i).filter(i=>G.tiles[i].num);const low=maxBy(nums.filter(i=>mineT.has(i)),i=>-pips(G.tiles[i].num));
    const high=maxBy(nums.filter(i=>!mineT.has(i)),i=>pips(G.tiles[i].num));
    if(low!=null&&high!=null&&pips(G.tiles[high].num)-pips(G.tiles[low].num)>=2){await playHouse(p,'numswap',[low,high]);return true}}

  return false}
function nextTurn(){G.cur=(G.cur+1)%4;G.turn++;G.phase='roll';G.devPlayed=false;G.dice=null;G.offer=null;G.freeRoads=0;L.mode=null}

/* ---------- computer players ---------- */
function vScore(v,p){let s=0;const types=new Set(),have=prodOf(p);
  v.hexes.forEach(ti=>{const t=G.tiles[ti];if(t.type==='desert')return;s+=pips(t.num)*(t.type==='ore'||t.type==='grain'?1.1:1)*(ti===G.robber&&G.phase!=='setup'?.4:1);types.add(t.type)});
  s+=types.size*.8;types.forEach(r=>{if(!have[r])s+=1.3});
  if(v.port)s+=v.port==='any'?1:(have[v.port]>=4?2:.4);return s+Math.random()*.2}
async function aiSetup(p){await sleep(420);
  if(G.sub==='settlement'){const best=maxBy(G.verts.filter(v=>canSettle(v.id,p.i,true)),v=>vScore(v,p));placeSetupSettlement(p.i,best.id);await push();render();await sleep(320)}
  const es=G.verts[G.lastSett].edges.filter(e=>canRoad(e,p.i));
  const best=maxBy(es,eid=>{const e=G.edges[eid],o=e.a===G.lastSett?e.b:e.a;return Math.max(0,...G.verts[o].adj.filter(a=>canSettle(a,p.i,true)).map(a=>vScore(G.verts[a],p)))});
  placeSetupRoad(p.i,best);await push();render()}
function missing(p,c){const m={};let t=0;for(const[r,n]of Object.entries(c)){const d=n-p.res[r];if(d>0){m[r]=d;t+=d}}m._t=t;return m}
function goal(p){const opts=[];
  const spot=G.verts.some(v=>canSettle(v.id,p.i,false));
  if(spot&&p.setts>0)opts.push(['settlement',0]);
  if(p.cities>0&&G.verts.some(v=>canCity(v.id,p.i)))opts.push(['city',.3]);
  if(!spot&&p.setts>0&&p.roads>0)opts.push(['road',.5]);
  if(G.deck.length)opts.push(['dev',1.2]);
  if(!opts.length)return 'dev';
  return maxBy(opts,([g,pen])=>-(missing(p,COST[g])._t+pen))[0]}
function roadTarget(p){const start=new Set();
  G.edges.forEach(e=>{if(e.road===p.i)[e.a,e.b].forEach(v=>{const b=G.verts[v].b;if(!b||b.p===p.i)start.add(v)})});
  G.verts.forEach(v=>{if(v.b&&v.b.p===p.i)start.add(v.id)});
  const dist=new Map(),first=new Map(),q=[];start.forEach(v=>{dist.set(v,0);q.push(v)});let best=null,bs=-1;
  while(q.length){const v=q.shift(),d=dist.get(v),V=G.verts[v];
    if(d>0&&!V.b&&!V.adj.some(a=>G.verts[a].b)){const s=vScore(V,p)/(d+.5);if(s>bs){bs=s;best=first.get(v)}}
    if(d>=3||(d>0&&V.b&&V.b.p!==p.i))continue;
    for(const eid of V.edges){const e=G.edges[eid];if(e.road!==null)continue;const o=e.a===v?e.b:e.a;if(dist.has(o))continue;dist.set(o,d+1);first.set(o,d===0?eid:first.get(v));q.push(o)}}
  return best}
function aiDiscard(p,k){for(let i=0;i<k;i++){const r=maxBy(RES,r=>p.res[r]-(COST[goal(p)][r]||0)*.5);p.res[r]--}}
function aiRobberHex(pi){const lead=Math.max(...G.players.map(p=>vp(p)));
  return G.tiles.map((t,i)=>i).filter(i=>i!==G.robber).map(i=>{const t=G.tiles[i];let s=Math.random()*.3;
    t.v.forEach(vid=>{const b=G.verts[vid].b;if(!b)return;if(b.p===pi)s-=100;else{const o=G.players[b.p];s+=pips(t.num)*(b.city?2:1)*(1+vp(o)/5)*(vp(o)===lead?1.4:1)}});return[i,s]}).sort((a,b)=>b[1]-a[1])[0][0]}
const robberHurts=pi=>G.tiles[G.robber].v.some(v=>G.verts[v].b&&G.verts[v].b.p===pi);
async function aiAct(p){
  if(G.rules==='house'&&await aiHouse(p))return true;
  if(!G.devPlayed){
    if(canPlayDev(p,'knight')&&(robberHurts(p.i)||(p.knights>=2&&G.army!==p.i))){await playDev(p,'knight');return true}
    const spot=G.verts.some(v=>canSettle(v.id,p.i,false));
    if(canPlayDev(p,'road')&&p.roads>=2&&!spot&&p.setts>0&&roadTarget(p)!=null){await playDev(p,'road');return true}
    if(canPlayDev(p,'monopoly')){const others=r=>G.players.reduce((s,o)=>o===p?s:s+o.res[r],0);const r=maxBy(RES,others);if(others(r)>=3){await playDev(p,'monopoly',r);return true}}
    if(canPlayDev(p,'plenty')){const m=missing(p,COST[goal(p)]);if(m._t>0&&m._t<=2){const picks=[];RES.forEach(r=>{for(let k=0;k<(m[r]||0);k++)picks.push(r)});while(picks.length<2)picks.push('ore');await playDev(p,'plenty',picks);return true}}
  }
  if(afford(p,COST.city)&&p.cities>0){const vs=G.verts.filter(v=>canCity(v.id,p.i));if(vs.length){buildCity(p,maxBy(vs,v=>vScore(v,p)).id);return true}}
  if(afford(p,COST.settlement)&&p.setts>0){const vs=G.verts.filter(v=>canSettle(v.id,p.i,false));if(vs.length){buildSettlement(p,maxBy(vs,v=>vScore(v,p)).id);return true}}
  const g=goal(p);
  if(g==='road'&&afford(p,COST.road)&&p.roads>0){const e=roadTarget(p);if(e!=null){buildRoad(p,e);return true}}
  if(afford(p,COST.dev)&&G.deck.length&&(g==='dev'||cards(p)>8)){buyDev(p);return true}
  const m=missing(p,COST[g]);
  if(m._t>0){for(const r of RES){if(!m[r])continue;const give=RES.find(x=>x!==r&&p.res[x]-(COST[g][x]||0)>=rate(p.i,x));
    if(give){const k=rate(p.i,give);p.res[give]-=k;p.res[r]++;log(p,`traded ${k} ${RN[give]} to the bank for 1 ${RN[r]}`);return true}}}
  return false}
async function aiTurn(p){await sleep(450);
  if(G.phase==='roll'){
    if(canPlayDev(p,'knight')&&robberHurts(p.i))await playDev(p,'knight');
    if(won()||G.botRunner!==ME)return;
    await rollDice();await sleep(550)}
  if(G.phase!=='main')return;
  for(let i=0;i<14&&!won()&&G.botRunner===ME;i++){const did=await aiAct(p);checkWin();await push();render();if(!did)break;await sleep(420)}
  if(!won()&&G.botRunner===ME){nextTurn();await push()}}
function aiAccepts(p,give,get,from){if(vp(G.players[from],true)>=WIN-2)return false;
  if(RES.some(r=>p.res[r]<get[r]))return false;
  const g=goal(p),need=missing(p,COST[g]);const val=r=>1+(need[r]?1.2:0);
  let gain=0,cost=0;
  RES.forEach(r=>{gain+=give[r]*val(r);if(get[r]){const keep=(COST[g][r]||0)>p.res[r]-get[r]?1:0;cost+=get[r]*(val(r)+keep)}});
  return gain>=cost+.3}
const botsShouldRun=()=>G&&G.players&&['setup','roll','main'].includes(G.phase)&&!won()&&isBot(P())&&G.botRunner===ME;
async function runBots(){if(L.busy)return;L.busy=true;render();
  try{while(botsShouldRun()){if(G.phase==='setup')await aiSetup(P());else await aiTurn(P())}}
  catch(e){console.error(e)}

/* ---------- syncing with Supabase ---------- */
function sync(dst,src){
  if(Array.isArray(dst)){for(let i=0;i<src.length;i++){const a=dst[i],b=src[i];if(a&&b&&typeof a==='object'&&typeof b==='object'&&Array.isArray(a)===Array.isArray(b))sync(a,b);else dst[i]=b}dst.length=src.length;return}
  for(const k of Object.keys(dst))if(!(k in src))delete dst[k];
  for(const k in src){const a=dst[k],b=src[k];if(a&&b&&typeof a==='object'&&typeof b==='object'&&Array.isArray(a)===Array.isArray(b))sync(a,b);else dst[k]=b}}
let pushChain=Promise.resolve(true);
function push(){pushChain=pushChain.then(doPush,doPush);return pushChain}
async function doPush(){if(!G||!CODE)return false;const base=G.v,nv=base+1;const snapshot=JSON.parse(JSON.stringify(G));snapshot.v=nv;
  pushing++;myMaxV=Math.max(myMaxV,nv);
  try{const{data,error}=await sb.from('hh_games').update({state:snapshot,v:nv}).eq('id',CODE).eq('v',base).select('v');
    if(error){toast('Could not reach the game server: '+error.message);return 'error'}
    if(!data||!data.length){await refetch();return false}
    if(G.v===base)G.v=nv;return true}
  catch(e){toast('Connection problem. Check your internet.');return 'error'}
  finally{pushing--}}
async function refetch(){const{data}=await sb.from('hh_games').select('state,v').eq('id',CODE).maybeSingle();
  if(data&&data.v>=G.v){sync(G,data.state);G.v=data.v;afterChange()}}
async function mutate(fn){for(let i=0;i<6;i++){if(fn()===false){render();return false}const r=await push();if(r===true){afterChange();return true}if(r==='error')return false}return false}
function onRemote(row){if(!row||!row.state||!G)return;if(row.v<=G.v)return;if(pushing&&row.v<=myMaxV)return;sync(G,row.state);G.v=row.v;afterChange()}
let lastBeat=0;
const ROOM_WAIT=60000;
const closesIn=()=>G&&G.phase==='lobby'&&!G.joined&&G.seats.length<=1?Math.max(0,(G.created||0)+ROOM_WAIT-Date.now()):null;
setInterval(async()=>{if(!G||G.phase!=='lobby'||G.host!==UID)return;const left=closesIn();if(left===null)return;
  if(left<=0){await mutate(()=>{if(G.phase!=='lobby'||G.joined)return false;G.phase='closed'});goHome();L.err='Nobody joined within a minute, so the room closed.';render();return}
  const el=document.getElementById('countdown');if(el)el.textContent=Math.ceil(left/1000)},1000);
async function poll(){if(!CODE||pushing)return;
  if(G&&G.phase==='lobby'&&G.host===UID&&Date.now()-lastBeat>20000){lastBeat=Date.now();mutate(()=>{if(G.phase!=='lobby')return false;G.hb=Date.now()})}try{const{data}=await sb.from('hh_games').select('v').eq('id',CODE).maybeSingle();if(data&&data.v>G.v&&!pushing)await refetch()}catch(e){}
  if(G&&G.phase!=='lobby'&&isBot(P())&&G.botRunner!==ME)render()}
function waitUntil(pred){return new Promise(res=>{if(pred())res();else waiters.push({pred,res})})}
function checkWaiters(){waiters=waiters.filter(w=>{if(w.pred()){w.res();return false}return true})}
function afterChange(){if(G&&G.phase==='closed'){goHome();L.err='That room closed because nobody joined.';render();return}
  L.lastChange=Date.now();ME=G.players?G.players.findIndex(p=>p.uid===UID):-1;
  if(G.phase==='lobby')L.winShown=false;

  if(botsShouldRun()&&!L.busy&&!L.flow)runBots();

async function connect(code){
  const{data,error}=await sb.from('hh_games').select('state,v').eq('id',code).maybeSingle();
  if(error||!data){L.err=error?'Could not reach the game server: '+error.message:`No game found with code ${esc(code)}.`;CODE=null;history.replaceState(null,'',location.pathname);render();return false}
  if(data.state&&data.state.phase==='closed'){L.err='That room closed because nobody joined. Tap Quick join or start a new game.';CODE=null;history.replaceState(null,'',location.pathname);render();return false}
  CODE=code;history.replaceState(null,'',location.pathname+'?g='+code);store.set('hh-last',code);
  G=data.state;G.v=data.v;
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('game-'+code).on('postgres_changes',{event:'UPDATE',schema:'public',table:'hh_games',filter:'id=eq.'+code},pl=>onRemote(pl.new)).subscribe();
  clearInterval(pollTimer);pollTimer=setInterval(poll,4000);lastBeat=Date.now();
  afterChange();return true}

/* pick up an unfinished robber move or free roads after a reload */
function resume(){if(!G||!G.players||L.flow||L.busy||won()||G.phase==='lobby')return;
  const actor=isBot(P())?G.botRunner===ME:G.cur===ME;if(!actor)return;
  if(G.cur===ME&&G.freeRoads>0&&G.phase==='main'&&!L.mode){L.mode='freeRoad';render()}
  const pendingRobber=G.phase==='robber'||(G.phase==='discard'&&(!G.discards||!Object.keys(G.discards).length));
  if(!pendingRobber)return;
  L.flow=true;(async()=>{try{G.discards=null;await moveRobber();G.phase=G.dice?'main':'roll';await push()}
    catch(e){console.error(e)}finally{L.flow=false;afterChange()}})()}

/* discards on a 7 and trade offers involve other players' devices */
async function promptDiscard(){L.discarding=true;
  try{const k=G.discards[ME];const sel=await discardModal(k);
    await mutate(()=>{if(!G.discards||!G.discards[ME])return false;const me=G.players[ME];if(RES.some(r=>me.res[r]<sel[r]))return false;
      RES.forEach(r=>me.res[r]-=sel[r]);delete G.discards[ME];log(me,`discarded ${k} cards`)})}
  finally{L.discarding=false}}
function resolveOffer(){const o=G&&G.offer;if(!o||o.from!==ME||o.resolving)return;
  if(o.to.every(i=>o.declined.includes(i))){o.resolving=true;
    mutate(()=>{if(!G.offer||G.offer.id!==o.id)return false;const off=G.offer,me=G.players[ME];
      const bot=G.players.find(p=>isBot(p)&&aiAccepts(p,off.give,off.get,ME));
      if(bot&&RES.every(r=>me.res[r]>=off.give[r])){RES.forEach(r=>{me.res[r]+=off.get[r]-off.give[r];bot.res[r]+=off.give[r]-off.get[r]});log(bot,`accepted ${pn(me)}'s trade: ${fmt(off.give)} for ${fmt(off.get)}`)}
      else log(null,`No one accepted ${pn(me)}'s offer of ${fmt(off.give)} for ${fmt(off.get)}.`);
      G.offer=null})}}

/* ---------- local input ---------- */
const myTurn=()=>ME>=0&&G.cur===ME&&!won()&&G.phase!=='discard';
function hotVerts(){const s=new Set();if(!myTurn())return s;
  if(L.pick)return L.pick.kind==='vert'?new Set(L.pick.set):s;
  if(G.phase==='setup'&&G.sub==='settlement')G.verts.forEach(v=>{if(canSettle(v.id,ME,true))s.add(v.id)});
  else if(L.mode==='settlement')G.verts.forEach(v=>{if(canSettle(v.id,ME,false))s.add(v.id)});
  else if(L.mode==='city')G.verts.forEach(v=>{if(canCity(v.id,ME))s.add(v.id)});return s}
function hotEdges(){const s=new Set();if(!myTurn())return s;
  if(L.pick)return L.pick.kind==='edge'?new Set(L.pick.set):s;
  if((G.phase==='setup'&&G.sub==='road')||L.mode==='road'||L.mode==='freeRoad')G.edges.forEach(e=>{if(canRoad(e.id,ME))s.add(e.id)});return s}
function hotTiles(){const s=new Set();if(L.pick)return L.pick.kind==='tile'&&myTurn()?new Set(L.pick.set):s;if(L.mode==='robber'&&myTurn())G.tiles.forEach((t,i)=>{if(i!==G.robber)s.add(i)});return s}
function setupSpotInfo(id){const v=G.verts[id],second=G.setupIdx>=4;
  const tiles=v.hexes.map(ti=>G.tiles[ti]);
  const touch=tiles.map(t=>`<span class="chip${t.type==='desert'?' light':''}" style="background:${TILE[t.type].fill}">${t.type==='desert'?'Dunes':RN[t.type]}${t.num?' · '+t.num:''}</span>`).join(' ');
  let txt=`<b>Touches:</b><br>${touch}`;
  if(v.port)txt+=`<br><b>Harbor:</b> ${v.port==='any'?'trade any 3 for 1':'trade 2 '+RN[v.port]+' for 1'}`;
  if(second){const g={};tiles.forEach(t=>{if(t.type!=='desert')g[t.type]=(g[t.type]||0)+1});
    txt+=`<br><br><b>You'll get right away:</b> ${fmt(g)||'nothing (only Dunes here)'}`}
  return txt}
const costTxt=c=>Object.entries(c).map(([r,n])=>n+' '+RN[r]).join(', ');
async function confirmBuild(title,text,okLabel){if(L.confirming)return false;L.confirming=true;render();
  try{return await chooseModal(title,text,[{label:okLabel,value:true},{label:'Cancel',value:false}],true)}finally{L.confirming=false}}
async function onVertex(id){const me=G.players[ME];if(!hotVerts().has(id))return;
  if(L.pick){if(!M.hidden)return;const r=L.pick.resolve;r(id);return}
  if(G.phase==='setup'){
    if(L.confirming)return;L.confirming=true;L.vertPreview=id;render();
    const ok=await chooseModal(`Place your ${G.setupIdx>=4?'second':'first'} settlement here?`,setupSpotInfo(id),[{label:'Place settlement',value:true},{label:'Pick another spot',value:false}],true);
    L.confirming=false;L.vertPreview=null;
    if(!ok||!hotVerts().has(id)){render();return}placeSetupSettlement(ME,id);render();await push();return}
  const city=L.mode==='city';L.vertPreview=id;
  const ok=await confirmBuild(city?'Upgrade this settlement to a city?':'Build a settlement here?',
    `Costs <b>${costTxt(city?COST.city:COST.settlement)}</b>.${city?' Worth 2 points and doubles what this spot collects.':' Worth 1 point.'}`,city?'Build city':'Build settlement');
  L.vertPreview=null;
  if(!ok||!hotVerts().has(id)||!afford(me,city?COST.city:COST.settlement)){render();return}
  if(L.mode==='settlement')buildSettlement(me,id);else if(L.mode==='city')buildCity(me,id);
  L.mode=null;checkWin();render();await push()}
async function onEdge(id){const me=G.players[ME];if(!hotEdges().has(id))return;
  if(L.pick){if(!M.hidden)return;const r=L.pick.resolve;r(id);return}
  if(G.phase==='setup'){placeSetupRoad(ME,id);G.botRunner=ME;render();await push();afterChange();return}
  if(L.mode==='road'){L.edgePreview=id;
    const ok=await confirmBuild('Build a road here?',`Costs <b>${costTxt(COST.road)}</b>.`,'Build road');
    L.edgePreview=null;
    if(!ok||!hotEdges().has(id)||!afford(me,COST.road)||L.mode!=='road'){render();return}
    buildRoad(me,id);L.mode=null}
  else if(L.mode==='freeRoad'){buildRoad(me,id,true);G.freeRoads--;if(G.freeRoads<=0||!hotEdges().size){L.mode=null;G.freeRoads=0}}
  checkWin();render();await push()}
function onTile(id){if(L.pick&&hotTiles().has(id)){if(M.hidden)L.pick.resolve(id);return}if(hotTiles().has(id)&&L.robberResolve){const r=L.robberResolve;L.robberResolve=null;r(id)}}

/* full screen: real Fullscreen API where it exists; on iPhone, explain Add to Home Screen */
const isStandalone=()=>navigator.standalone===true||(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches));
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsSupported=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function fsButton(attr){if(isStandalone())return '';return `<button class="ghost" ${attr}="fs" title="Full screen" aria-label="${fsEl()?'Exit full screen':'Full screen'}">${fsEl()?'Exit full screen':'Full screen'}</button>`}
async function toggleFullscreen(){
  if(fsEl()){try{await (document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}return}
  if(fsSupported()&&!isIOS()){const d=document.documentElement;try{await (d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'})}catch(e){toast('Your browser blocked full screen.')}return}
  modal(`<h3>Play full screen on iPhone</h3><p>iPhones don't let websites go full screen, but you can add the game to your home screen and it opens with no browser bars:</p>
    <p>1. Tap the <b>Share</b> button (the square with an arrow) at the bottom of Safari.<br>2. Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.<br>3. Open <b>Hearth &amp; Harbor</b> from your home screen.</p>
    <div class="opts"><button class="primary" data-c="ok">Got it</button></div>`,b=>{if(b.dataset.c)closeModal()})}
document.addEventListener('fullscreenchange',()=>render());document.addEventListener('webkitfullscreenchange',()=>render());
/* quitting: your seat goes to a computer player so the others can keep going */
let quitArm=0,quitTimer=null;
function goHome(){store.set('hh-last','');CODE=null;G=null;ME=-1;L.mode=null;L.flow=false;L.winShown=false;L.robberResolve=null;closeModal();clearInterval(pollTimer);if(chan){sb.removeChannel(chan);chan=null}
  history.replaceState(null,'',location.pathname);L.openSig='';render();refreshOpen()}
async function quitGame(){
  if(G&&G.players&&ME>=0&&!won()){const seat=ME;
    await mutate(()=>{const p=G.players[seat];if(!p||p.uid!==UID)return false;
      p.kind='bot';p.uid=null;log(p,'left the game. A computer player took over.');
      if(G.discards&&G.discards[seat]){aiDiscard(p,G.discards[seat]);delete G.discards[seat]}
      if(G.offer){if(G.offer.from===seat)G.offer=null;else if(G.offer.to.includes(seat)&&!G.offer.declined.includes(seat))G.offer.declined.push(seat)}
      if(G.cur===seat&&G.freeRoads)G.freeRoads=0;
      if(G.botRunner===seat){const other=G.players.find(q=>!isBot(q));G.botRunner=other?other.i:-1}})}
  else if(G&&G.phase==='lobby'){await mutate(()=>{if(G.phase!=='lobby')return false;const i=G.seats.findIndex(s=>s.uid===UID);if(i<0)return;G.seats.splice(i,1);
    if(G.host===UID&&G.seats.length)G.host=G.seats[0].uid})}
  goHome()}
function copyLink(){const url=location.origin+location.pathname+'?g='+CODE;
  try{navigator.clipboard.writeText(url).then(()=>toast('Invite link copied'),()=>toast(url))}catch(e){toast(url)}}
const onAct=async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,me=G.players[ME];
  if(a==='copy'){copyLink();return}
  if(a==='fs'){toggleFullscreen();return}
  if(a==='quit'){if(quitArm&&Date.now()-quitArm<3000){quitArm=0;clearTimeout(quitTimer);await quitGame()}
    else{quitArm=Date.now();b.textContent='Tap again to quit';clearTimeout(quitTimer);quitTimer=setTimeout(()=>{quitArm=0;render()},3000)}return}
  if(a==='takeover'){await mutate(()=>{G.botRunner=ME});return}
  if(a==='accept'||a==='decline'){const id=b.dataset.id;
    if(a==='accept')await mutate(()=>{const o=G.offer;if(!o||o.id!==id)return false;const from=G.players[o.from],to=G.players[ME];
      if(RES.some(r=>from.res[r]<o.give[r]||to.res[r]<o.get[r])){toast('Someone no longer has those cards.');return false}
      RES.forEach(r=>{from.res[r]+=o.get[r]-o.give[r];to.res[r]+=o.give[r]-o.get[r]});log(to,`accepted ${pn(from)}'s trade: ${fmt(o.give)} for ${fmt(o.get)}`);G.offer=null});
    else await mutate(()=>{const o=G.offer;if(!o||o.id!==id)return false;if(!o.declined.includes(ME))o.declined.push(ME)});
    return}
  if(ME<0)return;
  if(a==='cancel'){G.offer=null;log(me,'withdrew a trade offer');render();await push();return}
  if(a==='roll'){L.flow=true;L.rolledAt=Date.now();render();try{await rollDice()}finally{L.flow=false}checkWin();render();await push();return}
  if(a==='end'){if(Date.now()-(L.rolledAt||0)<1000)return;
    if(Date.now()-(L.endArm||0)>=3000){L.endArm=Date.now();render();clearTimeout(L.endArmT);L.endArmT=setTimeout(()=>{L.endArm=0;render()},3000);return}
    L.endArm=0;clearTimeout(L.endArmT);L.mode=null;nextTurn();G.botRunner=ME;render();await push();afterChange();return}
  if(a.startsWith('mode-')){const m=a.slice(5);L.mode=L.mode===m?null:m;render();return}
  if(a==='buydev'){const ok=await confirmBuild('Buy a development card?',`Costs <b>${costTxt(COST.dev)}</b>. You draw a random card: a Knight, Victory Point, Road Building, Year of Plenty or Monopoly.`,'Buy card');
    if(!ok||!myTurn()||G.phase!=='main'||!afford(me,COST.dev)||!G.deck.length){render();return}
    buyDev(me);checkWin();render();await push();return}
  if(a.startsWith('play-')){const t=a.slice(5);
    if(isHouse(t)){const ok=await confirmBuild(`Play ${DEV[t][0]}?`,DEV[t][1],'Play it');if(!ok||!canPlayDev(me,t)||!myTurn()){render();return}}
    L.flow=true;L.mode=null;render();try{await playDev(me,t)}finally{L.flow=false;L.pick=null}render();return}
  if(a==='bank'){const{bg,bt}=L.ui,k=rate(ME,bg);me.res[bg]-=k;me.res[bt]++;log(me,`traded ${k} ${RN[bg]} to the bank for 1 ${RN[bt]}`);render();await push();return}
  if(a==='tr'){const side=b.dataset.side,other=side==='give'?'get':'give',r=b.dataset.r,d=+b.dataset.d,u=L.ui;
    u[side][r]=Math.max(0,u[side][r]+d);if(side==='give')u.give[r]=Math.min(u.give[r],me.res[r]);if(u[side][r])u[other][r]=0;render();return}
  if(a==='trclear'){RES.forEach(r=>{L.ui.give[r]=0;L.ui.get[r]=0});render();return}
  if(a==='offer'){const give={...L.ui.give},get={...L.ui.get};RES.forEach(r=>{L.ui.give[r]=0;L.ui.get[r]=0});
    const humans=G.players.filter(p=>!isBot(p)&&p.i!==ME&&RES.every(r=>p.res[r]>=get[r])).map(p=>p.i);
    if(humans.length){G.offer={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),from:ME,give,get,to:humans,declined:[]};log(me,`offered ${fmt(give)} for ${fmt(get)}`);render();await push();return}
    const bot=G.players.find(p=>isBot(p)&&aiAccepts(p,give,get,ME));
    if(bot){RES.forEach(r=>{me.res[r]+=get[r]-give[r];bot.res[r]+=give[r]-get[r]});log(bot,`accepted ${pn(me)}'s trade: ${fmt(give)} for ${fmt(get)}`)}
    else log(null,`No one accepted ${pn(me)}'s offer of ${fmt(give)} for ${fmt(get)}.`);
    render();await push()}
};

  const devGroups={};me.dev.forEach(d=>{devGroups[d.type]=devGroups[d.type]||{n:0,ready:0};devGroups[d.type].n++;if(d.turn<G.turn)devGroups[d.type].ready++});
  const devHtml=Object.keys(devGroups).length?Object.entries(devGroups).map(([t,g])=>{const can=t!=='vp'&&canPlayDev(me,t)&&my&&!G.offer&&((t==='knight'||t==='desert')?(G.phase==='roll'||G.phase==='main')&&!L.mode:G.phase==='main'&&!L.mode);
    return `<div class="dev"><div><b>${DEV[t][0]}${g.n>1?' ×'+g.n:''}</b><small>${DEV[t][1]}${t!=='vp'&&t!=='desert'&&g.ready<g.n?' New cards play next turn.':''}${t==='desert'?` You have ${desertCount(ME)} of 3.`:''}</small></div>${t==='vp'?'':`<button data-act="play-${t}" ${can?'':'disabled'}>Play</button>`}</div>`}).join(''):'<div class="empty">No development cards yet. They cost one Wool, Grain and Ore.</div>';
  const u=L.ui,bk=rate(ME,u.bg);
  const opt=k=>RES.map(r=>`<option value="${r}" ${u[k]===r?'selected':''}>${RN[r]}</option>`).join('');
  $('#panel').innerHTML=dice+`
  <section><h2>Your hand</h2><div class="hand">${RES.map(r=>`<div class="card ${me.res[r]?'':'zero'}" style="background:${TILE[r].fill}"><div class="n">${me.res[r]}</div><div class="l">${RN[r]}</div></div>`).join('')}</div></section>
  <section><h2>Build</h2><div class="builds">
    <button data-act="mode-road" class="${L.mode==='road'?'active':''}" ${bOK.road||L.mode==='road'?'':'disabled'}>Road · ${me.roads} left${costChips(COST.road)}</button>
    <button data-act="mode-settlement" class="${L.mode==='settlement'?'active':''}" ${bOK.settlement||L.mode==='settlement'?'':'disabled'}>Settlement · 1 pt${costChips(COST.settlement)}</button>
    <button data-act="mode-city" class="${L.mode==='city'?'active':''}" ${bOK.city||L.mode==='city'?'':'disabled'}>City · 2 pts${costChips(COST.city)}</button>
    <button data-act="buydev" ${main&&!L.mode&&afford(me,COST.dev)&&G.deck.length?'':'disabled'}>Dev card · ${G.deck.length} left${costChips(COST.dev)}</button>
  </div></section>
  <section><h2>Development cards</h2><div class="devs">${devHtml}</div></section>
  <section><h2>Trade</h2><div class="trade">
    <div class="trow"><span class="lbl">Bank</span><select id="bg" data-ui="bg" aria-label="Give to bank">${opt('bg')}</select><span>×${bk} →</span><select id="bt" data-ui="bt" aria-label="Get from bank">${opt('bt')}</select>
      <button data-act="bank" ${main&&!L.mode&&u.bg!==u.bt&&me.res[u.bg]>=bk?'':'disabled'}>Trade</button></div>
    <div class="offer">
      <span class="lbl">You have</span>${RES.map(r=>`<span class="oh"><span class="ohtop"><b class="have${me.res[r]?'':' none'}">${me.res[r]}</b><span class="sw" style="background:${TILE[r].fill}"></span></span>${RN[r]}</span>`).join('')}
      ${['give','get'].map(side=>`<span class="lbl">${side==='give'?'You give':'You get'}</span>${RES.map(r=>{const n=u[side][r],canUp=main&&!L.mode&&(side==='get'||n<me.res[r]);
        return `<span class="step ${n?'on':''}"><button data-act="tr" data-side="${side}" data-r="${r}" data-d="-1" ${main&&n?'':'disabled'} aria-label="${side} one less ${RN[r]}">−</button><b>${n}</b><button data-act="tr" data-side="${side}" data-r="${r}" data-d="1" ${canUp?'':'disabled'} aria-label="${side} one more ${RN[r]}">+</button></span>`}).join('')}`).join('')}
    </div>
    <div class="trow"><button data-act="offer" class="primary" ${main&&!L.mode&&RES.some(r=>u.give[r])&&RES.some(r=>u.get[r])&&RES.every(r=>u.give[r]<=me.res[r])?'':'disabled'}>Offer to players</button><button class="ghost" data-act="trclear" ${RES.some(r=>u.give[r]||u.get[r])?'':'disabled'}>Clear</button></div>
  </div></section>`+players+logH}
function render(){
  const inGame=G&&G.phase&&G.phase!=='lobby';
  $('#app').hidden=!inGame;$('#lobby').hidden=!!inGame;
  if(!inGame){if(!M.hidden)closeModal();renderLobby();return}
  renderBoard();renderHud();renderOffer();renderPanel();renderBelt();renderMapScore();checkAlerts();turnFlash();
  if(won()&&!L.winShown)showWin();
  if(G.discards&&G.discards[ME]&&!L.discarding&&!won())promptDiscard()}

/* ---------- boot ---------- */
/* is this device still a player in that game? (used to drop you back in after the phone reloads the page) */
async function stillSeated(code){try{const{data}=await sb.from('hh_games').select('state').eq('id',code).maybeSingle();const s=data&&data.state;
  if(!s||s.phase==='closed'||s.winner!=null){store.set('hh-last','');return false}
  if(s.phase==='lobby')return (s.seats||[]).some(x=>x.uid===UID);
  return (s.players||[]).some(p=>p.uid===UID)}catch(e){return false}}
/* catch up the moment you come back to the tab */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CODE&&G&&!pushing)refetch().catch(()=>{})});
window.addEventListener('pageshow',e=>{if(e.persisted&&CODE&&G)refetch().catch(()=>{})});
(async function boot(){
  if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY&&window.supabase)sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  const code=new URLSearchParams(location.search).get('g');
  if(sb&&code){L.codeDraft=code.toUpperCase();await connect(code.toUpperCase())}
  else if(sb&&store.get('hh-last')&&await stillSeated(store.get('hh-last')))await connect(store.get('hh-last'));
  else render();
  if(sb){refreshOpen();openTimer=setInterval(refreshOpen,5000)}})();
</script>
